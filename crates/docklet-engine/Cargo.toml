[package]
name = "docklet-engine"
description = "Docker Engine client wrapper: events, logs, stats, exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# No TLS and no HTTP transport: the engine is only reached over the local pipe.
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
docklet-core = { workspace = true }
futures-util = { version = "0.3", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
