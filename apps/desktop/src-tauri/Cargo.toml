[package]
name = "docklet-desktop"
description = "Lightweight WSL2 + Docker Engine manager for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "docklet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
docklet-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12", features = ["tray-icon"] }
