[package]
name = "docklet-native"
description = "Docklet's native Win32 window and tray icon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The library holds the shell so the engine side can drive it; the binary
# only reads the command line.
[lib]
name = "docklet_native"
path = "src/lib.rs"

[[bin]]
name = "docklet-native"
path = "src/main.rs"

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # Clipboard: copying log lines and table rows.
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # The single-instance mutex.
    "Win32_System_Threading",
    # Telling screen readers that a checkbox the app toggled changed.
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
