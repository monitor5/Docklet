[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]
# Built for Linux inside the distro image, with its own lockfile.
exclude = ["distro/relay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/monitor5/Docklet"
rust-version = "1.99"

[workspace.dependencies]
docklet-core = { path = "crates/docklet-core" }
docklet-wsl = { path = "crates/docklet-wsl" }
docklet-proxy = { path = "crates/docklet-proxy" }
docklet-engine = { path = "crates/docklet-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1.54"
windows = "0.62"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
