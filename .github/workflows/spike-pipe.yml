# M0 spike 2: message-mode named pipe relay and the Docker CLI half-close,
# run on a hosted runner (stock WSL kernel) so a hang cannot affect a
# developer machine. Every test has a hard timeout and reports through
# annotations. Results are recorded in docs/spikes.md.
name: Spike - named pipe half-close

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/spike-pipe.yml]

permissions:
  contents: read

env:
  WSL_UTF8: "1"
  ROOTFS_URL: https://github.com/${{ github.repository }}/releases/download/distro-v0.1.0/rootfs.tar.gz
  DOCKER_CLI_URL: https://download.docker.com/win/static/stable/x86_64/docker-29.9.3.zip
  DOCKER_HOST: npipe:////./pipe/docklet_engine

defaults:
  run:
    shell: pwsh

jobs:
  half-close:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [message, byte]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build docklet-proxy
        run: cargo build --release -p docklet-proxy
      - name: Define test helper
        run: |
          $helper = @'
          function Report([string]$Kind, [string]$Title, [string]$Text) {
            $flat = ($Text -replace "`0", "" -replace "\s*\r?\n\s*", " | ").Trim()
            if ($flat.Length -gt 900) { $flat = $flat.Substring($flat.Length - 900) }
            Write-Host "::${Kind} title=$Title::$flat"
          }
          # Runs a cmd.exe command line with a hard timeout. Returns $true on exit 0.
          function Test-Docker([string]$Name, [string]$CommandLine, [int]$Seconds) {
            $out = "$env:RUNNER_TEMP\$Name.txt"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process cmd -ArgumentList "/c $CommandLine > `"$out`" 2>&1" -PassThru -WindowStyle Hidden
            if ($p.WaitForExit($Seconds * 1000)) { $state = "exit $($p.ExitCode)" }
            else { taskkill /F /T /PID $p.Id | Out-Null; $state = "TIMEOUT after ${Seconds}s" }
            $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + ""
            $ok = $state -eq "exit 0"
            Report ($(if ($ok) { "notice" } else { "error" })) "$Name ($state, $($watch.ElapsedMilliseconds) ms)" $text
            return $ok
          }
          function Report-Proxy {
            $cpu = (Get-Process docklet-proxy -ErrorAction SilentlyContinue | ForEach-Object { "cpu=$([int]$_.CPU)s ws=$([int]($_.WorkingSet64/1MB))MB" }) -join ","
            Report "notice" "proxy trace ($cpu)" ((Get-Content "$env:RUNNER_TEMP\proxy.err" -Raw -ErrorAction SilentlyContinue) + "")
          }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\helper.ps1" -Value $helper
      - name: Import rootfs and fetch the Docker CLI
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\rootfs.tar.gz" $env:ROOTFS_URL
          wsl --import docklet "$env:RUNNER_TEMP\docklet" "$env:RUNNER_TEMP\rootfs.tar.gz" --version 2
          curl.exe -fsSL -o "$env:RUNNER_TEMP\docker.zip" $env:DOCKER_CLI_URL
          Expand-Archive "$env:RUNNER_TEMP\docker.zip" -DestinationPath "$env:RUNNER_TEMP\cli"
      - name: Start keepalive and proxy (${{ matrix.mode }} mode)
        run: |
          Start-Process wsl -ArgumentList "-d docklet --exec /bin/sleep infinity" -WindowStyle Hidden
          wsl -d docklet --exec sh -c "for i in `$(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info --format '{{.ServerVersion}}'"
          $proxyArgs = @("--trace")
          if ("${{ matrix.mode }}" -eq "byte") { $proxyArgs += "--byte" }
          Start-Process "target\release\docklet-proxy.exe" -ArgumentList $proxyArgs -RedirectStandardError "$env:RUNNER_TEMP\proxy.err" -WindowStyle Hidden
          Start-Sleep -Seconds 2
      - name: 1. docker version
        run: |
          . "$env:RUNNER_TEMP\helper.ps1"
          $docker = "`"$env:RUNNER_TEMP\cli\docker\docker.exe`""
          if (-not (Test-Docker "version" "$docker version --format {{.Server.Version}}" 30)) { Report-Proxy; exit 1 }
      - name: 2. docker run hello-world
        run: |
          . "$env:RUNNER_TEMP\helper.ps1"
          $docker = "`"$env:RUNNER_TEMP\cli\docker\docker.exe`""
          if (-not (Test-Docker "hello-world" "$docker run --rm hello-world" 120)) { Report-Proxy; exit 1 }
      - name: 3. docker pull alpine
        run: |
          . "$env:RUNNER_TEMP\helper.ps1"
          $docker = "`"$env:RUNNER_TEMP\cli\docker\docker.exe`""
          if (-not (Test-Docker "pull" "$docker pull -q alpine" 120)) { Report-Proxy; exit 1 }
      - name: 4. half-close (echo hi | docker run -i --rm alpine cat)
        run: |
          . "$env:RUNNER_TEMP\helper.ps1"
          $docker = "`"$env:RUNNER_TEMP\cli\docker\docker.exe`""
          $ok = Test-Docker "half-close" "echo hi| $docker run -i --rm alpine cat" 60
          Report-Proxy
          if (-not $ok) { exit 1 }
      - name: 5. Proxy is idle afterwards
        if: always()
        run: |
          . "$env:RUNNER_TEMP\helper.ps1"
          $before = (Get-Process docklet-proxy -ErrorAction SilentlyContinue | Measure-Object CPU -Sum).Sum
          Start-Sleep -Seconds 10
          $after = (Get-Process docklet-proxy -ErrorAction SilentlyContinue | Measure-Object CPU -Sum).Sum
          $relays = @(Get-Process wsl -ErrorAction SilentlyContinue).Count
          $delta = [math]::Round($after - $before, 2)
          Report "notice" "idle check" "proxy CPU seconds used in 10s: $delta; wsl.exe processes: $relays"
          Report-Proxy
          if ($delta -gt 1) { exit 1 }
