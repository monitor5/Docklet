name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The native app is Win32 and does not build on Linux, so Linux covers
      # the platform-neutral crates.
      - name: Clippy
        run: cargo clippy -p docklet-app -p docklet-cli -p docklet-core -p docklet-engine -p docklet-proxy -p docklet-wsl --all-targets -- -D warnings
      - name: Relay (distro binary)
        run: |
          cargo fmt --manifest-path distro/relay/Cargo.toml --check
          cargo clippy --manifest-path distro/relay/Cargo.toml --locked -- -D warnings
      - name: Test
        run: cargo test -p docklet-app -p docklet-cli -p docklet-core -p docklet-engine -p docklet-proxy -p docklet-wsl
      # The only JSON file in the repository that a program reads at run time
      # (dockerd's config). A syntax error would stop the engine from starting.
      - name: JSON syntax
        run: jq empty distro/rootfs/etc/docker/daemon.json

  windows:
    name: App (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Open real named pipes and spawn processes, so these tests run here
      # and never on a developer PC. docklet-app and docklet-native have none
      # today; they are listed so that one added there runs here too.
      - name: Test (runner only)
        timeout-minutes: 5
        run: cargo test -p docklet-app -p docklet-native -p docklet-proxy -p docklet-wsl -p docklet-cli -- --ignored
      # Both programs are single executables with nothing to bundle. Their
      # sizes are reported with every run, since staying small is the point.
      - name: Build the CLI and the native app
        run: cargo build --release -p docklet-cli -p docklet-native
      - name: Report the executables' sizes
        run: |
          foreach ($name in "docklet", "docklet-native") {
            $size = (Get-Item "target/release/$name.exe").Length
            Write-Host "::notice title=$name.exe::$([math]::Round($size / 1KB)) KB"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: docklet
          path: target/release/docklet.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: docklet-native
          path: target/release/docklet-native.exe
          if-no-files-found: error
