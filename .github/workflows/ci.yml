name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The Tauri shell needs WebKitGTK on Linux and is Windows-only anyway,
      # so Linux covers the platform-neutral crates.
      - name: Clippy
        run: cargo clippy -p docklet-cli -p docklet-core -p docklet-engine -p docklet-proxy -p docklet-wsl --all-targets -- -D warnings
      - name: Relay (distro binary)
        run: |
          cargo fmt --manifest-path distro/relay/Cargo.toml --check
          cargo clippy --manifest-path distro/relay/Cargo.toml --locked -- -D warnings
      - name: Test
        run: cargo test -p docklet-cli -p docklet-core -p docklet-engine -p docklet-proxy -p docklet-wsl

  windows:
    name: App (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm biome ci .
      - name: Frontend tests
        run: pnpm -r test
      - name: Format
        run: cargo fmt --all --check
      # generate_context! needs the frontend bundle at compile time.
      - name: Build frontend
        run: pnpm --filter "@docklet/desktop" build
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build installer
        run: pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: docklet-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
