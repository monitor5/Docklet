# Builds the docklet WSL2 rootfs and publishes it as a release asset.
name: Distro rootfs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - distro/**
      - .github/workflows/distro.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build rootfs
        run: ./distro/build.sh
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat distro/VERSION)"
          tag="distro-v${version}"
          notes="docklet WSL2 rootfs ${version} (built from ${GITHUB_SHA})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" distro/out/* --clobber
          else
            gh release create "$tag" distro/out/* --title "$tag" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
